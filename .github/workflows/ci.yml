name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test-build:
    name: Lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt check
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: Check shell scripts
        run: |
          bash -n scripts/open-pr.sh
          bash -n scripts/check-base.sh

      - name: Validate inline HTML scripts
        run: |
          node -e '
          const fs = require("fs");
          const vm = require("vm");
          for (const file of ["static/index.html", "docs/index.html"]) {
            const html = fs.readFileSync(file, "utf8");
            const re = /<script(?![^>]*\bsrc=)([^>]*)>([\s\S]*?)<\/script>/gi;
            let match;
            let count = 0;
            while ((match = re.exec(html))) {
              if (/application\/json/i.test(match[1])) continue;
              new vm.Script(match[2], { filename: file + "#inline-" + (++count) });
            }
            console.log(file + ": OK on " + count + " inline scripts");
          }
          '

      - name: Build binary
        run: |
          VERSION="0.0.0-${GITHUB_SHA::7}"
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" -o terraview .

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: terraview-linux-amd64
          path: terraview
          if-no-files-found: error
          retention-days: 14
